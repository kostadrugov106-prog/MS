<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>MS — картинка для соцсетей</title>
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#F1F2F2;color:#2A2C2B;font-family:"Segoe UI","Arial",sans-serif}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .brand{display:flex;align-items:center;gap:26px}
  .mark{width:108px;height:108px;border-radius:50%;background:#2A2C2B;display:grid;place-items:center}
  .mark span{font-family:Consolas,"Courier New",monospace;font-weight:700;color:#F1F2F2;font-size:54px;letter-spacing:-.08em;line-height:1}
  .name{font-family:"Segoe UI Black","Arial Black",sans-serif;font-weight:900;font-size:86px;letter-spacing:-.045em;line-height:1}
  h1{font-family:"Segoe UI Black","Arial Black",sans-serif;font-weight:900;font-size:68px;line-height:1.02;letter-spacing:-.035em;margin:0;max-width:950px}
  p{margin:16px 0 0;font-size:28px;color:#5b5d5c;max-width:900px}
  .chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
  .chip{border:2px solid #cfd1d0;border-radius:999px;padding:10px 22px;font-size:22px;font-weight:600}
  .site{font-size:22px;color:#6e706f}
  .accent{position:absolute;right:-150px;bottom:-190px;width:560px;height:560px;border-radius:50%;border:2px solid #d8d9d9}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark"><span>&gt;_</span></div>
    <div class="name">MS</div>
  </div>
  <div>
    <h1>Русский язык программирования</h1>
    <p>Понятный синтаксис, лёгкий движок, Windows 7–11 без Python.</p>
    <div class="chips">
      <span class="chip">114 КБ</span>
      <span class="chip">Windows 7–11</span>
      <span class="chip">0 зависимостей</span>
    </div>
  </div>
  <div class="site">Mazing Studio · mazing-studio.site</div>
  <div class="accent"></div>
</div>
</body>
</html>
